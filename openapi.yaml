openapi: 3.1.0
info:
  title: Vatly API
  version: '1.0'
  x-generated-at: '2026-05-28'
  description: |
    Vatly is a Merchant of Record billing platform for European SaaS companies.
    This API enables you to manage checkouts, customers, orders, subscriptions, refunds, and more.

    ## Authentication

    The Vatly API uses Bearer token authentication. All API requests must include an `Authorization` header:

    ```
    Authorization: Bearer {your_api_token}
    ```

    ### Live vs Test Mode

    API tokens determine the environment mode:
    - Tokens prefixed with `live_` access **production** data
    - Tokens prefixed with `test_` access **sandbox** data

    Resources created in one mode cannot be accessed or referenced from the other mode.
    For example, a checkout created with a test token cannot reference a customer created with a live token.

    #### Payment methods in test mode

    A few payment methods work in live mode but cannot be completed in test mode,
    because the payment provider cannot settle them there. A test-mode checkout
    still lists them, greyed out and labelled as unavailable, so you can see they
    exist without being able to select one:

    | Method | Test mode | Reason |
    |--------|-----------|--------|
    | `banktransfer` | Not selectable | The provider cannot settle bank transfers in test mode |
    | `paybybank` | Not selectable | The provider cannot settle Pay by Bank in test mode |

    Every other method behaves identically in both modes. Test a checkout with any
    selectable method — `creditcard` and `ideal` cover the one-off and mandate flows —
    and the resulting orders, invoices and webhooks are the same ones live mode produces.

    ## Pagination

    List endpoints use cursor-based pagination with the following query parameters:

    | Parameter | Type | Description |
    |-----------|------|-------------|
    | `limit` | integer | Number of results per page (default: 10, max: 100) |
    | `startingAfter` | string | Cursor ID to fetch results after |
    | `endingBefore` | string | Cursor ID to fetch results before |

    `startingAfter` and `endingBefore` are mutually exclusive.

    All list responses are wrapped in a pagination envelope:

    ```json
    {
      "data": [ ... ],
      "count": 2,
      "links": {
        "self": { "href": "https://api.vatly.com/v1/orders", "type": "application/json" },
        "next": { "href": "https://api.vatly.com/v1/orders?startingAfter=order_abc", "type": "application/json" },
        "prev": null
      }
    }
    ```

    ## Money Format

    All monetary values are represented as objects with `value` (string) and `currency` (ISO 4217 code):

    ```json
    {
      "value": "99.99",
      "currency": "EUR"
    }
    ```

    Values are strings to preserve decimal precision.

    ## Email Format

    Vatly canonicalizes every email address it accepts, and stores and returns
    that canonical form:

    - the local part is lower-cased;
    - the domain is lower-cased and converted to its **Punycode (ASCII)** form
      per [UTS #46](https://www.unicode.org/reports/tr46/).

    So `User@Müller.de`, `USER@MÜLLER.DE` and `user@xn--mller-kva.de` are all
    accepted and all describe the same address. **Responses return the canonical
    form, which may therefore differ in spelling from what you submitted** —
    compare addresses after canonicalizing, or key off the resource `id`.

    Submitting an internationalized domain directly is fine; you do not need to
    encode it yourself. A domain that cannot be canonicalized at all — an empty
    label (`user@..com`), a malformed Punycode label (`user@xn--0.com`), a label
    over 63 characters — is rejected with `422`.

    Beyond that canonicalization the comparison is exact: `büyer@example.com`
    and `straße@example.com` are different addresses from `buyer@example.com`
    and `strasse@example.com`, and get their own customers.

    For human-friendly display in your own UI, decode the domain back to
    Unicode. Most languages provide this in the standard library — for
    example, PHP's `idn_to_utf8()`, Python's `idna.decode()`, or Node's
    [`url.domainToUnicode()`](https://nodejs.org/api/url.html#urldomaintounicodedomain).

    Local-part Unicode (EAI / SMTPUTF8) is not supported for delivery, but a
    non-ASCII local part is stored and compared verbatim (after lower-casing).

    ## Idempotency

    All mutating requests (`POST`, `PATCH`, `PUT`, `DELETE`) accept an
    optional `Idempotency-Key` header. When present, Vatly records the
    first response keyed by `(token, endpoint, key)` and returns it
    verbatim on subsequent requests with the same key, marking the
    replay with an `Idempotent-Replayed: true` response header.

    - **Use a fresh key per logical operation.** Generate one client-side
      (UUIDv4 is recommended) and retry transparently with the same key
      on network errors.
    - **Keys are bound to the exact parameters of the first request.**
      Replaying with a different body or different query parameters
      returns `409 Conflict`. Either retry with the original parameters
      or generate a new key.
    - **Keys expire after 24 hours.** After that the key is reusable as
      a fresh idempotency boundary.
    - **Scope is per endpoint.** The same key value on a different
      endpoint is treated as a new key.

    Sending an `Idempotency-Key` on a `GET` or `HEAD` request is ignored.

    ## Errors

    The API returns standard HTTP status codes and JSON error responses:

    | Status | Description |
    |--------|-------------|
    | 400 | Bad Request - Invalid request format |
    | 401 | Unauthorized - Missing or invalid token |
    | 403 | Forbidden - Token invalid or insufficient permissions |
    | 404 | Not Found - Resource doesn't exist |
    | 409 | Conflict - Idempotency-Key reused with different request parameters |
    | 422 | Unprocessable Entity - Validation failed |
    | 429 | Too Many Requests - Rate limit exceeded |
    | 500 | Internal Server Error |
  contact:
    name: Vatly Support
    url: https://vatly.com
    email: support@vatly.com
  license:
    name: Proprietary
    url: https://vatly.com/terms
servers:
  - url: https://api.vatly.com/v1
    description: Production API
  - url: https://api.staging.vatly.com/v1
    description: Staging API
security:
  - BearerAuth: []
tags:
  - name: Checkouts
    description: |
      Create and manage hosted checkout sessions.
      Checkouts allow customers to purchase one-off products and subscription plans through a hosted payment page.
  - name: Customers
    description: |
      Manage customer records.
      Customers are identified by email and can have multiple subscriptions and orders.
  - name: One-Off Products
    description: |
      Create and view one-off products.
      Products can be created in the Vatly dashboard or through the API. Live
      products are reviewed and approved by Vatly before they can be added to
      checkouts.
  - name: Subscription Plans
    description: |
      Create and view subscription plans.
      Plans define recurring billing intervals and pricing, and can be created
      in the Vatly dashboard or through the API. Live plans are reviewed and
      approved by Vatly before they can be added to checkouts.
  - name: Orders
    description: |
      View orders and request invoice address updates.
      Orders are created when checkouts complete or subscriptions renew.
  - name: Refunds
    description: |
      Create and manage refunds for paid orders.
      Supports both partial (per-item) and full refunds.
  - name: Chargebacks
    description: |
      View chargebacks initiated by the payment provider.
      Chargebacks are created automatically when a customer disputes a payment.
  - name: Subscriptions
    description: |
      Manage customer subscriptions.
      Update plans, quantities, billing details, or cancel subscriptions.
  - name: Webhook Events
    description: |
      View webhook events that were sent to your webhook endpoints.
      Each event contains the full resource payload at the time the event occurred.
  - name: Webhook Endpoints
    description: |
      Register and manage the endpoints Vatly delivers webhook events to.
      Create, list, update, and delete endpoints programmatically — useful for
      CI, infrastructure-as-code, and ephemeral preview environments. The
      signing secret is write-only: you supply it and it is never returned.
  - name: Test Helpers
    description: |
      Sandbox-only endpoints for simulating billing events.
      These endpoints require a `test_` prefixed API token.
paths:
  /checkouts:
    get:
      operationId: listCheckouts
      summary: List all checkouts
      description: |
        Returns a paginated list of checkouts for the authenticated merchant.
        Results are filtered by the testmode determined from the API token.
      tags:
        - Checkouts
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/startingAfter'
        - $ref: '#/components/parameters/endingBefore'
      responses:
        '200':
          description: List of checkouts
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - count
                  - links
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Checkout'
                  count:
                    type: integer
                    description: Number of items in the current page
                    example: 1
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
              example:
                data:
                  - id: checkout_QdEpFhdSrG4Y3DnfsdqsH
                    resource: checkout
                    customerId: null
                    orderId: null
                    testmode: false
                    redirectUrlSuccess: https://example.com/success
                    redirectUrlCanceled: https://example.com/canceled
                    metadata: {}
                    locale: null
                    status: created
                    expiresAt: '2024-01-16T10:30:00Z'
                    createdAt: '2024-01-15T10:30:00Z'
                    links:
                      checkoutUrl:
                        href: https://checkout.vatly.com/checkout_QdEpFhdSrG4Y3DnfsdqsH
                        type: text/html
                      self:
                        href: https://api.vatly.com/v1/checkouts/checkout_QdEpFhdSrG4Y3DnfsdqsH
                        type: application/json
                      order: null
                count: 1
                links:
                  self:
                    href: https://api.vatly.com/v1/checkouts
                    type: application/json
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      operationId: createCheckout
      summary: Create a checkout
      description: |
        Creates a new hosted checkout session.

        The checkout URL in the response can be used to redirect customers to complete their purchase.
        Checkouts expire after a configurable period (default: 24 hours).

        **Products:**
        - Include one or more products using their `one_off_product_` or `subscription_plan_` IDs
        - Mix one-off products and subscription plans in the same checkout
        - Override prices for specific products using the `price` field
        - Add trial periods to subscription plans using `trialDays`

        **Customer association:**
        - Optionally link to an existing customer using `customerId`
        - If not provided, a new customer is created based on checkout form input
      tags:
        - Checkouts
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutRequest'
            examples:
              oneOffProduct:
                summary: Checkout with one-off product (with {CHECKOUT_ID} placeholder)
                value:
                  redirectUrlSuccess: https://example.com/return?checkout_id={CHECKOUT_ID}
                  redirectUrlCanceled: https://example.com/canceled?checkout_id={CHECKOUT_ID}
                  products:
                    - id: one_off_product_Vr8kQdFhSrG4Y3DnfsdqH
                      quantity: 1
              subscriptionWithTrial:
                summary: Subscription plan with trial
                value:
                  redirectUrlSuccess: https://example.com/success
                  redirectUrlCanceled: https://example.com/canceled
                  customerId: customer_Fp2kQrSvWm8NjLhYbUcP
                  locale: de
                  products:
                    - id: subscription_plan_Bm7xNvPwKr3YjTgHcZaE
                      trialDays: 14
              customPrice:
                summary: Product with custom price
                value:
                  redirectUrlSuccess: https://example.com/success
                  redirectUrlCanceled: https://example.com/canceled
                  products:
                    - id: one_off_product_Vr8kQdFhSrG4Y3DnfsdqH
                      quantity: 2
                      price:
                        value: '49.99'
                        currency: EUR
                  metadata:
                    campaign: summer-sale
      responses:
        '201':
          description: Checkout created successfully
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
              example:
                id: checkout_Bm7xNvPwKr3YjTgHcZaE
                resource: checkout
                customerId: null
                orderId: null
                testmode: false
                redirectUrlSuccess: https://example.com/success
                redirectUrlCanceled: https://example.com/canceled
                metadata:
                  campaign: summer-sale
                locale: de
                status: created
                expiresAt: '2024-01-16T10:30:00Z'
                createdAt: '2024-01-15T10:30:00Z'
                links:
                  checkoutUrl:
                    href: https://checkout.vatly.com/checkout_Bm7xNvPwKr3YjTgHcZaE
                    type: text/html
                  self:
                    href: https://api.vatly.com/v1/checkouts/checkout_Bm7xNvPwKr3YjTgHcZaE
                    type: application/json
                  order: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: |
            Unprocessable Entity - The request was well-formed but contained validation errors.
            This includes the case where a referenced resource (e.g. `customerId`) exists but
            was created in a different mode — switch between live/test API tokens to access it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                validationFailed:
                  summary: Field validation failed
                  value:
                    message: The given data was invalid.
                    errors:
                      products.0.id:
                        - The selected products.0.id is invalid.
                testmodeMismatch:
                  summary: Referenced resource exists but in the wrong mode
                  value:
                    message: The given data was invalid.
                    errors:
                      customerId:
                        - Customer exists, but the wrong mode is used. Try switching live / test API keys.
        default:
          $ref: '#/components/responses/UnexpectedError'
  /checkouts/{checkoutId}:
    get:
      operationId: getCheckout
      summary: Get a checkout
      description: |
        Retrieves a specific checkout by its ID.
        Use this to check the status of a checkout or get the order ID after completion.
      tags:
        - Checkouts
      parameters:
        - $ref: '#/components/parameters/checkoutId'
      responses:
        '200':
          description: Checkout details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
              example:
                id: checkout_QdEpFhdSrG4Y3DnfsdqsH
                resource: checkout
                customerId: customer_7kBmRtPvXw2NjLhYcZaE
                orderId: order_Jk4pQrSvWm8NjLhYbUcP
                testmode: false
                redirectUrlSuccess: https://example.com/return?checkout_id=checkout_QdEpFhdSrG4Y3DnfsdqsH
                redirectUrlCanceled: https://example.com/canceled
                metadata:
                  campaign: summer-sale
                locale: null
                status: paid
                expiresAt: '2024-01-16T10:30:00Z'
                createdAt: '2024-01-15T10:30:00Z'
                links:
                  checkoutUrl:
                    href: https://checkout.vatly.com/checkout_QdEpFhdSrG4Y3DnfsdqsH
                    type: text/html
                  self:
                    href: https://api.vatly.com/v1/checkouts/checkout_QdEpFhdSrG4Y3DnfsdqsH
                    type: application/json
                  order:
                    href: https://api.vatly.com/v1/orders/order_Jk4pQrSvWm8NjLhYbUcP
                    type: application/json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /customers:
    get:
      operationId: listCustomers
      summary: List all customers
      description: |
        Returns a paginated list of customers for the authenticated merchant.
        Results are filtered by the testmode determined from the API token.

        Pass `email` to filter the list down to the customers holding an address —
        the way back to a customer id you no longer have.
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/customerEmailFilter'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/startingAfter'
        - $ref: '#/components/parameters/endingBefore'
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - count
                  - links
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
                  count:
                    type: integer
                    description: Number of items in the current page
                    example: 2
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
              example:
                data:
                  - id: customer_7kBmRtPvXw2NjLhYcZaE
                    resource: customer
                    testmode: false
                    email: john.doe@example.com
                    name: John Doe
                    createdAt: '2024-01-15T10:30:00Z'
                    metadata:
                      userId: user_Qp8kNvBxKw7RjTgYcZaE
                    links:
                      self:
                        href: https://api.vatly.com/v1/customers/customer_7kBmRtPvXw2NjLhYcZaE
                        type: application/json
                  - id: customer_Lp3mNvBxKw7RjTgYcZaE
                    resource: customer
                    testmode: false
                    email: jane.smith@acme.com
                    name: Jane Smith
                    createdAt: '2024-01-10T08:15:00Z'
                    metadata: {}
                    links:
                      self:
                        href: https://api.vatly.com/v1/customers/customer_Lp3mNvBxKw7RjTgYcZaE
                        type: application/json
                count: 2
                links:
                  self:
                    href: https://api.vatly.com/v1/customers
                    type: application/json
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      operationId: createCustomer
      summary: Create a customer
      description: |
        Creates a customer, or returns the one that already holds the address.

        Customers are uniquely identified by email within a storefront and
        testmode, and this endpoint is get-or-create on that key: posting an
        address that already exists returns the existing customer rather than a
        validation error, so an integration that lost its Vatly customer id can
        always get back to it. The status code says which happened:

        | Status | Meaning |
        | --- | --- |
        | `201` | The customer was created by this request. |
        | `200` | A customer with this email already existed and is returned unchanged. |

        A `200` response never modifies the customer — `name` and `metadata` in
        the request body are ignored for an existing customer. Use
        `PATCH /v1/customers/{customerId}` to change one.

        A `201` can also complete a create that was interrupted before it
        finished, in which case the customer keeps the `id` and `createdAt` of
        that earlier attempt — so `createdAt` may predate the request. Treat it as
        when the customer came into being, not as when this call happened.

        Addresses are canonicalized before they are compared, so `User@MÜLLER.de`
        and `user@xn--mller-kva.de` are the same customer. Beyond that the
        comparison is exact — `büyer@example.com` is a different mailbox and gets
        its own customer.

        **Use cases:**
        - Pre-create customers before checkout
        - Link existing users from your system to Vatly
        - Recover the customer id for a known email after a re-sync or reset
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
            example:
              email: customer@example.com
              metadata:
                userId: user_Qp8kNvBxKw7RjTgYcZaE
      responses:
        '200':
          description: |
            A customer with this email already existed. It is returned unchanged —
            nothing in the request body was applied.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: customer_7kBmRtPvXw2NjLhYcZaE
                resource: customer
                testmode: false
                email: customer@example.com
                name: John Doe
                createdAt: '2024-01-15T10:30:00Z'
                metadata:
                  userId: user_Qp8kNvBxKw7RjTgYcZaE
                links:
                  self:
                    href: https://api.vatly.com/v1/customers/customer_7kBmRtPvXw2NjLhYcZaE
                    type: application/json
        '201':
          description: Customer created successfully
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: customer_7kBmRtPvXw2NjLhYcZaE
                resource: customer
                testmode: false
                email: customer@example.com
                name: John Doe
                createdAt: '2024-01-15T10:30:00Z'
                metadata:
                  userId: user_Qp8kNvBxKw7RjTgYcZaE
                links:
                  self:
                    href: https://api.vatly.com/v1/customers/customer_7kBmRtPvXw2NjLhYcZaE
                    type: application/json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /customers/{customerId}:
    get:
      operationId: getCustomer
      summary: Get a customer
      description: Retrieves a specific customer by their ID.
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: customer_7kBmRtPvXw2NjLhYcZaE
                resource: customer
                testmode: false
                email: john.doe@example.com
                name: John Doe
                createdAt: '2024-01-15T10:30:00Z'
                metadata:
                  userId: user_Qp8kNvBxKw7RjTgYcZaE
                links:
                  self:
                    href: https://api.vatly.com/v1/customers/customer_7kBmRtPvXw2NjLhYcZaE
                    type: application/json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    patch:
      operationId: updateCustomer
      summary: Update a customer
      description: |
        Updates a customer's identity fields. Only `name` and `email` may be
        changed here, and both are optional — send whichever you want to update.

        Billing-address details (company name, tax ID, street, city, country,
        etc.) are not supported by this endpoint and are ignored; amend those
        through the hosted billing-update flow, which validates tax-relevant
        data centrally so invoices stay accurate.

        An `email` is canonicalized before it is stored, so the address you read
        back may differ in spelling from the one you sent. Moving a customer onto
        an address another customer in the same storefront and mode already holds
        returns `422`.
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/customerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
            example:
              name: John Doe
              email: new.email@example.com
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: customer_7kBmRtPvXw2NjLhYcZaE
                resource: customer
                testmode: false
                email: new.email@example.com
                name: John Doe
                createdAt: '2024-01-15T10:30:00Z'
                metadata:
                  userId: user_Qp8kNvBxKw7RjTgYcZaE
                links:
                  self:
                    href: https://api.vatly.com/v1/customers/customer_7kBmRtPvXw2NjLhYcZaE
                    type: application/json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'
