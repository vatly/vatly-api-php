        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOneOffProductRequest'
            example:
              name: Premium License v2
              basePrice:
                value: '349.00'
                currency: EUR
      responses:
        '200':
          description: Update submitted; the product now carries a pending update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOffProduct'
              example:
                id: one_off_product_Vr8kQdFhSrG4Y3DnfsdqH
                resource: one_off_product
                testmode: false
                name: Premium License
                description: Lifetime access to all premium features
                basePrice:
                  value: '299.00'
                  currency: EUR
                taxBehavior: exclusive
                productType: saas
                status: active
                archivedAt: null
                pendingUpdates:
