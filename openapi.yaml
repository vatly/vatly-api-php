        '422':
          description: |
            Subscription is not within an active grace period. Common causes:
            - Subscription was canceled immediately (status `canceled`)
            - Grace period has already lapsed (`status` is now `canceled`)
            - Subscription is already active (was not canceled, or already resumed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /test-helpers/subscriptions/{subscriptionId}/fast-forward-renewal:
    post:
      operationId: fastForwardSubscriptionRenewal
      summary: Fast-forward subscription renewal
      description: |
        Simulates a subscription renewal cycle for testing purposes.

        **Requirements:**
        - Only available in test mode (requires `test_` prefixed API token)
        - Subscription must belong to the authenticated merchant

        **Use cases:**
        - Test renewal billing flows without waiting for the actual billing cycle
        - Verify subscription lifecycle events and webhooks
        - Exercise your payment-recovery handling by forcing the renewal payment to
          fail (`paymentStatus: failed`)
        - Reach both recovery timelines by naming the decline: a soft one retries
          over weeks, a hard one asks the customer for a new payment method

        Requesting an outcome for a renewal that produced no payable order, or whose
        payment has already settled, is an error rather than a silent no-op.
      tags:
        - Test Helpers
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FastForwardSubscriptionRenewalRequest'
            examples:
              advanceOnly:
                summary: Advance the cycle and leave the payment pending
                value: {}
              failed:
                summary: Decline the renewal payment and start a recovery
                value:
                  paymentStatus: failed
              hardDecline:
                summary: Decline it as a dead payment method
                value:
                  paymentStatus: failed
                  failureReason: card_expired
              paid:
                summary: Settle the renewal payment
                value:
                  paymentStatus: paid
      responses:
        '200':
          description: Subscription renewed successfully
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              example:
                id: subscription_Lp3mNvBxKw7RjTgYcZaE
                resource: subscription
                customerId: customer_Lp3mNvBxKw7RjTgYcZaE
                subscriptionPlanId: subscription_plan_Rk5pQrSvWm8NjLhYbUcP
                testmode: true
                name: Pro Monthly
                description: Full access to all Pro features
                billingAddress:
                  fullName: John Doe
                  companyName: Acme Corp
                  streetAndNumber: 123 Main Street
                  city: Berlin
                  postalCode: '10115'
                  country: DE
                basePrice:
                  value: '29.00'
                  currency: EUR
                quantity: 1
                interval: month
                intervalCount: 1
                status: active
                mandate:
                  method: card
                  maskedIdentifier: '4242'
                startedAt: '2024-01-15T10:30:00Z'
                endedAt: null
                canceledAt: null
                renewedAt: '2024-03-15T10:30:00Z'
                renewedUntil: '2024-04-15T10:30:00Z'
                nextRenewalAt: '2024-04-15T10:30:00Z'
                trialUntil: null
                scheduledUpdate: null
                links:
                  self:
                    href: https://api.vatly.com/v1/subscriptions/subscription_Lp3mNvBxKw7RjTgYcZaE
                    type: application/json
                  customer:
                    href: https://api.vatly.com/v1/customers/customer_Lp3mNvBxKw7RjTgYcZaE
                    type: application/json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'
